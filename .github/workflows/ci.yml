name: COBOL batch regression (GLPOST01 + PRCUPD01)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnucobol
          cobc --version | head -1

      - name: Build load module
        run: scripts/build.sh

      - name: Run job + golden-master compare
        run: |
          rc=0
          scripts/run_job.sh || rc=$?
          echo "PRCUPD01 MAXCC=$rc"
          test "$rc" -eq 4     # 4 = expected warnings (skips / rejects on PRCRPT)

      - name: Regression test harness (PRCUPD01)
        run: tests/run_tests.sh

      - name: GLPOST01 job + file parity + regression harness
        run: tests/run_glpost01_tests.sh

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-outputs
          path: |
            work/PRCUPD01.rpt
            work/ITEM_PRICE.csv
            work/PRICE_HIST.csv
            work-glpost01/GLPOSTED.dat
            work-glpost01/GLEXCEPT.dat
            work-glpost01/GLPOST01.rpt
            work-glpost01-run.log
          retention-days: 14
